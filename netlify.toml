[build]
  # WHY: No build command — this is a purely static site.
  # ignore sets Netlify to skip asset processing on files with special characters.
  command = ""
  publish = "."
  functions = "netlify/functions"
  ignore = "/dev/null"

[functions]
  node_bundler = "esbuild"

# WHY: Redirect /api/* to serverless functions so the chat UI
# can call /api/housing-chat instead of /.netlify/functions/housing-chat
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# WHY: SPA-style fallback not needed — this is a static site with
# explicit HTML pages. 404s should stay 404s.
